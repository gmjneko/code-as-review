spring:
  application:
    name: code-as-review

  datasource:
    url: jdbc:mysql://localhost:3306/code_as_review?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password@mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${CR_REDIS_HOST:localhost}
      port: ${CR_REDIS_PORT:6379}
      password: ${CR_REDIS_PASSWORD:}
      database: ${CR_REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

code-review:
  workspace-root: ${CR_WORKSPACE_ROOT:${user.home}/.code-as-review}
  local-repo-roots:
    - ${CR_LOCAL_REPO_ROOT:${user.home}/DevLab}
  executor:
    task-concurrency: 2
    queue-capacity: 100
  review:
    default-effort: medium
    max-prompt-diff-tokens: 60000
    max-file-diff-tokens: 30000
    max-task-tokens: 2000000
    max-comments: 50
    plan-line-threshold: 80
    max-iters: 40
    git-timeout-seconds: 120
  rag:
    # RAG 默认关闭；开启后 Webhook 和手动全量同步才会创建 RAG 任务。
    enabled: ${CR_RAG_ENABLED:false}
    embedding:
      # API key 只从环境变量读取，避免进入仓库、SQL 或日志。
      base-url: ${CR_RAG_EMBEDDING_BASE_URL:https://llm-2oj5be0xcuob8n58.cn-beijing.maas.aliyuncs.com/api/v1}
      api-key: ${CR_RAG_EMBEDDING_API_KEY:}
      model: ${CR_RAG_EMBEDDING_MODEL:qwen3.7-text-embedding}
      dimension: ${CR_RAG_EMBEDDING_DIMENSION:1024}
      batch-size: ${CR_RAG_EMBEDDING_BATCH_SIZE:20}
    milvus:
      uri: ${CR_RAG_MILVUS_URI:http://124.220.39.95:19530}
      token: ${CR_RAG_MILVUS_TOKEN:}
      database: ${CR_RAG_MILVUS_DATABASE:}
      collection: ${CR_RAG_MILVUS_COLLECTION:code_review_rag_chunks}
    elasticsearch:
      # ES 是可选的 BM25 后端，关闭时自动使用 Milvus-only。
      enabled: ${CR_RAG_ES_ENABLED:false}
      url: ${CR_RAG_ES_URL:http://space-51q23auv.ap-nanjing.qcloudes.com}
      username: ${CR_RAG_ES_USERNAME:}
      password: ${CR_RAG_ES_PASSWORD:}
      index: ${CR_RAG_ES_INDEX:code_review_rag_chunks}
    retrieval:
      backend-top-k: ${CR_RAG_BACKEND_TOP_K:20}
      verify-top-k: ${CR_RAG_VERIFY_TOP_K:3}
      rrf-k: ${CR_RAG_RRF_K:60}
    worker:
      concurrency: ${CR_RAG_WORKER_CONCURRENCY:1}
      queue-capacity: ${CR_RAG_WORKER_QUEUE_CAPACITY:20}
    timeouts:
      embedding-seconds: ${CR_RAG_EMBEDDING_TIMEOUT_SECONDS:30}
      milvus-seconds: ${CR_RAG_MILVUS_TIMEOUT_SECONDS:10}
      elasticsearch-seconds: ${CR_RAG_ES_TIMEOUT_SECONDS:10}
      verification-seconds: ${CR_RAG_VERIFICATION_TIMEOUT_SECONDS:120}
  sandbox:
    image: ${CR_SANDBOX_IMAGE:ubuntu:22.04}
    workspace-root: ${CR_SANDBOX_WORKSPACE_ROOT:/workspace}
    memory-size-bytes: ${CR_SANDBOX_MEMORY_BYTES:2147483648}
    cpu-count: ${CR_SANDBOX_CPU_COUNT:2}
    network: ${CR_SANDBOX_NETWORK:none}
    command-timeout-seconds: ${CR_SANDBOX_COMMAND_TIMEOUT_SECONDS:120}
    max-output-bytes: ${CR_SANDBOX_MAX_OUTPUT_BYTES:524288}
  llm-default:
    base-url: ${CR_LLM_BASE_URL:}
    api-key: ${CR_LLM_API_KEY:}
    model-name: ${CR_LLM_MODEL:}
  security:
    jwt-secret: ${CR_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    credential-key: ${CR_CREDENTIAL_KEY:change-me-credential-encryption-key}
